name: Release Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      candidate_sha:
        description: Main commit used as the base for the tested version candidate
        required: true
        type: string
      candidate_version:
        description: Version branch name to prepare and build
        required: true
        type: string
      candidate_tree_sha:
        description: Expected source tree after applying the version bump
        required: true
        type: string

concurrency:
  group: mdview-release-${{ inputs.candidate_sha || github.ref }}
  cancel-in-progress: ${{ inputs.candidate_sha == '' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Simulate merged release version
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "${HEAD_REF}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node scripts/bump-version.mjs --version "${HEAD_REF}"
          fi
      - name: Validate release version sources
        run: node scripts/validate-release-version.mjs
      - name: Run pnpm test
        run: pnpm test
      - name: Run release integrity tests
        run: node --test tests/release-integrity.test.mjs
      - name: Run pnpm typecheck
        run: pnpm typecheck
      - name: Run pnpm build
        run: pnpm build
      - name: Run cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Run cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Run cargo clippy -- -D warnings
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  bundle:
    name: Bundle ${{ matrix.platform }}
    if: inputs.candidate_sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - platform: windows
            os: windows-latest
            bundles: nsis
          - platform: macos
            os: macos-latest
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Prepare and verify candidate tree
        env:
          VERSION: ${{ inputs.candidate_version }}
          EXPECTED_TREE: ${{ inputs.candidate_tree_sha }}
        run: |
          node scripts/bump-version.mjs --version "${VERSION}"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          actual_tree="$(git write-tree)"
          test "${actual_tree}" = "${EXPECTED_TREE}"
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - run: pnpm install --frozen-lockfile
      - name: Build Linux bundles
        if: matrix.platform == 'linux'
        run: ./scripts/build-linux-bundles.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Windows and macOS bundles
        if: matrix.platform != 'linux'
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Record updater target
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          case "${{ runner.arch }}" in
            ARM64) echo "darwin-aarch64" > updater-target-macos.txt ;;
            X64) echo "darwin-x86_64" > updater-target-macos.txt ;;
            *) echo "Unsupported macOS runner arch: ${{ runner.arch }}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mdview-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.sig
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.sig
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            updater-target-*.txt
          if-no-files-found: error

  prepare-release-assets:
    name: Validate release assets and notes
    needs: bundle
    if: inputs.candidate_sha != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare and validate release notes and updater manifest
        env:
          VERSION: ${{ inputs.candidate_version }}
        shell: bash
        run: |
          node scripts/bump-version.mjs --version "${VERSION}"
          awk -v heading="## [${VERSION}]" '
            $0 == heading { in_section=1; next }
            in_section && substr($0, 1, 4) == "## [" { exit }
            in_section { print }
          ' CHANGELOG.md > release-section.md
          if [[ ! -s release-section.md ]] || grep -q "Automatically released from merged version branch" release-section.md; then
            echo "Add release notes for ${VERSION} to CHANGELOG.md before merging the version branch." >&2
            exit 1
          fi
          {
            echo "# mdview v${VERSION}"
            echo
            cat release-section.md
          } > RELEASE_NOTES.md
          node scripts/create-updater-manifest.mjs \
            --version "${VERSION}" \
            --tag "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir release-assets \
            --output latest.json
          node scripts/validate-release-version.mjs --tag "v${VERSION}" --latest latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mdview-release-metadata
          path: |
            RELEASE_NOTES.md
            latest.json
          if-no-files-found: error

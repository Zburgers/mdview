name: Release Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mdview-release-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: Validate release version sources
        run: node scripts/validate-release-version.mjs
        if: "!startsWith(github.ref, 'refs/tags/v')"
      - name: Validate tagged release version
        run: node scripts/validate-release-version.mjs --tag "${GITHUB_REF_NAME}"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Validate immutable release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_sha="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" "refs/tags/${GITHUB_REF_NAME}^{}" | node scripts/resolve-release-tag.mjs)"
          test "${tag_sha}" = "${GITHUB_SHA}"
      - run: pnpm test
      - run: node --test tests/release-integrity.test.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

  bundle:
    name: Bundle ${{ matrix.platform }}
    needs: validate
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - platform: windows
            os: windows-latest
            bundles: nsis
          - platform: macos
            os: macos-latest
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build-linux-bundles.sh
        if: matrix.platform == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
        if: matrix.platform != 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Record updater target
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          case "${{ runner.arch }}" in
            ARM64) echo "darwin-aarch64" > updater-target-macos.txt ;;
            X64) echo "darwin-x86_64" > updater-target-macos.txt ;;
            *) echo "Unsupported macOS runner arch: ${{ runner.arch }}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: mdview-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.sig
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.sig
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            updater-target-*.txt
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          test "${tag}" = "v${version}"
          grep -q "^## \[${version}\]$" CHANGELOG.md

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          notes_file="RELEASE_NOTES.md"
          {
            echo "# mdview ${tag}"
            echo
            awk -v heading="## [${version}]" '
              $0 == heading { in_section=1; next }
              in_section && substr($0, 1, 4) == "## [" { exit }
              in_section { print }
            ' CHANGELOG.md
          } > "$notes_file"

          test "$(wc -l < "$notes_file")" -gt 2
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: find release-assets -maxdepth 5 -type f -print | sort
      - name: Generate updater manifest
        run: |
          node scripts/create-updater-manifest.mjs \
            --version "${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --assets-dir release-assets \
            --output latest.json
      - name: Validate generated updater manifest
        run: node scripts/validate-release-version.mjs --tag "${{ steps.release.outputs.tag }}" --latest latest.json
      - name: Refuse to mutate a release from another commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_sha="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" "refs/tags/${GITHUB_REF_NAME}^{}" | node scripts/resolve-release-tag.mjs)"
          test "${tag_sha}" = "${GITHUB_SHA}"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)"
          if [[ -n "${release_json}" ]]; then
            target_commitish="$(jq -r '.target_commitish // empty' <<<"${release_json}")"
            if [[ -n "${target_commitish}" && "${target_commitish}" != "${GITHUB_SHA}" ]]; then
              echo "Existing release ${GITHUB_REF_NAME} points at ${target_commitish}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: mdview ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.sig
            release-assets/**/*.app.tar.gz
            latest.json
